# Gera o instalador da edição Estudante no GitHub Actions (ADR 0021) e, quando a SignPath estiver configurada,
# assina o instalador. Rodar à mão: aba Actions > Instalador > Run workflow. Também roda ao publicar uma versão (v*).
#
# Cadeia de build protegida (ADR 0027): ações fixadas pelo SHA do commit (uma tag pode ser movida para código
# malicioso), permissão de escrita só no job que anexa à versão, e hash conferido de tudo o que é baixado:
# pacote de dados (aqui), Python embutido e dependências (instalador/construir.py).
name: Instalador

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  DADOS: dados-2026.1                                        # versão-prévia com questões, imagens e parâmetros TRI
  DADOS_SHA256: 9a3d3557cb99ba75fee18cf76576e1e6f6a01a270edc09adc36e8da2c3cc96fd  # trocar junto com DADOS
  INNOSETUP: 6.7.1
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}   # vazio = assinatura desligada

jobs:
  construir:
    # Versões do programa começam com "v"; o pacote de dados (dados-*) não gera instalador.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12.10"   # a mesma do Python embutido no instalador

      - name: Dependências e testes
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r instalador/requirements-lock.txt
          python -m unittest discover tests

      - name: Inno Setup
        run: choco install innosetup --version $env:INNOSETUP -y --no-progress

      - name: Dados (questões, imagens, parâmetros TRI)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:DADOS --pattern dados.zip --dir .
          $sha = (Get-FileHash dados.zip -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:DADOS_SHA256) { throw "dados.zip não confere com o SHA-256 conhecido ($sha)" }
          Expand-Archive dados.zip -DestinationPath data -Force  # os testes já criaram um data/ vazio

      - name: Montar o instalador
        run: python instalador/construir.py

      - name: Guardar o instalador (sem assinatura)
        id: artefato
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: instalador
          path: dist/TRIunfo-Estudante-*.exe
          if-no-files-found: error

      # Assinatura pela SignPath Foundation (docs/ASSINATURA.md). Fica desligada até existir a variável
      # SIGNPATH_ORGANIZATION_ID e o segredo SIGNPATH_API_TOKEN no repositório.
      - name: Assinar (SignPath)
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e  # v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: triunfo-enem
          signing-policy-slug: release-signing
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.artefato.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: assinado

      - name: Usar o instalador assinado e recalcular o SHA-256
        if: env.SIGNPATH_ORGANIZATION_ID != ''
        run: |
          Copy-Item assinado/*.exe dist/ -Force
          foreach ($exe in Get-ChildItem dist/TRIunfo-Estudante-*.exe) {
            $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
            Set-Content "$exe.sha256" "$sha  $($exe.Name)" -Encoding ascii -NoNewline
          }

      - name: Guardar o pacote final (instalador e SHA-256)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: pacote
          path: dist/TRIunfo-Estudante-*
          if-no-files-found: error

      - name: Resumo
        run: Get-ChildItem dist/TRIunfo-Estudante-* | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1MB)) MB" }

  anexar:
    # Só este job escreve no repositório, e não roda código do projeto: baixa o pacote e anexa à versão.
    needs: construir
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: pacote
          path: pacote

      - name: Anexar à versão publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" pacote/TRIunfo-Estudante-* --clobber --repo "${{ github.repository }}"
