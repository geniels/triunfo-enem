<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRIunfo ENEM</title>
  <link rel="icon" href="/static/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Aparência antes de pintar a página (sem piscar). "auto" segue o sistema e muda junto com ele.
    (function () {
      var pref = {};
      try { pref = JSON.parse(localStorage.getItem("triunfo-aparencia")) || {}; } catch (e) {}
      var raiz = document.documentElement, sistema = matchMedia("(prefers-color-scheme: dark)");
      function aplicar() {
        raiz.dataset.tema = pref.tema === "escuro" || (pref.tema !== "claro" && sistema.matches) ? "escuro" : "claro";
        raiz.dataset.cor = pref.cor || "azul";
      }
      aplicar();
      sistema.addEventListener("change", aplicar);
      window.aparencia = function (novo) {
        Object.assign(pref, novo);
        try { localStorage.setItem("triunfo-aparencia", JSON.stringify(pref)); } catch (e) {}
        aplicar();
        return { tema: pref.tema || "auto", cor: pref.cor || "azul" };
      };
    })();
  </script>
</head>
